spring.application.name=student-management

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/student_management
spring.datasource.username=root
spring.datasource.password=2403
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate (MySQL dialect auto-detected from driver — no manual dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Table/column naming: camelCase -> snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# JWT
app.jwt.secret=StudentManagementJwtSecretKey2026MustBeAtLeast256BitsLongForHS256Algorithm
app.jwt.expiration-ms=86400000

# CORS (comma-separated origins)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true