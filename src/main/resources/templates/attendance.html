<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance — Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout-nav :: sidebar}"></div>
    <div class="main-content">
        <header class="page-header">
            <h1 class="page-title">Attendance</h1>
        </header>
        <main class="page-body">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem">

                <!-- Mark Attendance — POST /attendance -->
                <div class="card">
                    <div class="card-header"><span class="card-title">Mark Attendance</span></div>
                    <div class="card-body">
                        <form id="attendance-form" onsubmit="return false;">
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="att-studentId">Student ID *</label>
                                <input id="att-studentId" type="text" placeholder="e.g. STU2024001">
                                <span class="field-error" id="att-studentId-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="att-courseCode">Course Code *</label>
                                <input id="att-courseCode" type="text" placeholder="e.g. CS101">
                                <span class="field-error" id="att-courseCode-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="att-date">Date *</label>
                                <input id="att-date" type="date">
                                <span class="field-error" id="att-date-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="att-status">Status *</label>
                                <select id="att-status">
                                    <option value="">— Select Status —</option>
                                    <option value="PRESENT">Present</option>
                                    <option value="ABSENT">Absent</option>
                                    <option value="LATE">Late</option>
                                </select>
                                <span class="field-error" id="att-status-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="att-remarks">Remarks</label>
                                <input id="att-remarks" type="text" placeholder="Optional notes">
                            </div>
                            <button class="btn btn-primary" style="width:100%" onclick="markAttendance()">Mark Attendance</button>
                        </form>
                    </div>
                </div>

                <!-- Attendance Percentage — GET /attendance/percentage -->
                <div class="card">
                    <div class="card-header"><span class="card-title">Attendance Percentage</span></div>
                    <div class="card-body">
                        <div class="form-group" style="margin-bottom:.75rem">
                            <label for="pct-studentId">Student ID</label>
                            <input id="pct-studentId" type="text" placeholder="e.g. STU2024001"
                                   onkeydown="if(event.key==='Enter') loadAttendancePercentage()">
                        </div>
                        <div class="form-group" style="margin-bottom:.75rem">
                            <label for="pct-courseCode">Course Code</label>
                            <input id="pct-courseCode" type="text" placeholder="e.g. CS101"
                                   onkeydown="if(event.key==='Enter') loadAttendancePercentage()">
                        </div>
                        <button class="btn btn-primary" style="width:100%;margin-bottom:1rem" onclick="loadAttendancePercentage()">Calculate</button>
                        <div id="percentage-result" style="display:none"></div>
                    </div>
                </div>
            </div>

            <!-- View Attendance Records -->
            <div class="card">
                <div class="card-header"><span class="card-title">View Attendance Records</span></div>
                <div class="card-body">
                    <div class="toolbar">
                        <div class="search-box">
                            <input id="att-filter-studentId" type="text" placeholder="Filter by Student ID"
                                   onkeydown="if(event.key==='Enter') loadAttendanceByStudent()">
                            <button class="btn btn-primary" onclick="loadAttendanceByStudent()">By Student</button>
                        </div>
                        <div class="search-box">
                            <input id="att-filter-courseCode" type="text" placeholder="Filter by Course Code"
                                   onkeydown="if(event.key==='Enter') loadAttendanceByCourse()">
                            <button class="btn btn-outline" onclick="loadAttendanceByCourse()">By Course</button>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Student ID</th><th>Student Name</th><th>Course Code</th>
                                    <th>Course Name</th><th>Date</th><th>Status</th><th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody id="attendance-tbody">
                                <tr><td colspan="7" class="empty-state">Use the filters above to load records.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/validation.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/attendance.js}"></script>
<script>
    requireAuth();
    renderUserInfo();
    document.getElementById('nav-attendance').classList.add('active');
    document.getElementById('att-date').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
