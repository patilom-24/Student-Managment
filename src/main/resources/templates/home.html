<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout-nav :: sidebar}"></div>

    <div class="main-content">
        <header class="page-header">
            <h1 class="page-title">Admin Dashboard</h1>
            <div class="header-right">
                <span style="font-size:.8rem;color:var(--text-muted)" id="current-date"></span>
            </div>
        </header>

        <main class="page-body">

            <!-- Stat Cards -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">👥</div>
                    <div>
                        <div class="stat-label">Total Students</div>
                        <div class="stat-value" id="stat-students">—</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">👨‍🏫</div>
                    <div>
                        <div class="stat-label">Total Faculty</div>
                        <div class="stat-value" id="stat-faculty">—</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon yellow">📚</div>
                    <div>
                        <div class="stat-label">Total Courses</div>
                        <div class="stat-value" id="stat-courses">—</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">💰</div>
                    <div>
                        <div class="stat-label">Fee Records</div>
                        <div class="stat-value" id="stat-fees">—</div>
                    </div>
                </div>
            </div>

            <!-- Quick Access -->
            <div class="card" style="margin-bottom:1.5rem">
                <div class="card-header"><span class="card-title">Quick Access</span></div>
                <div class="card-body">
                    <div class="quick-links">
                        <a href="/page/students"   class="quick-card"><div class="qc-icon">👥</div><div class="qc-label">Students</div></a>
                        <a href="/page/faculty"    class="quick-card"><div class="qc-icon">👨‍🏫</div><div class="qc-label">Faculty</div></a>
                        <a href="/page/courses"    class="quick-card"><div class="qc-icon">📚</div><div class="qc-label">Courses</div></a>
                        <a href="/page/attendance" class="quick-card"><div class="qc-icon">📋</div><div class="qc-label">Attendance</div></a>
                        <a href="/page/fees"       class="quick-card"><div class="qc-icon">💰</div><div class="qc-label">Fees</div></a>
                    </div>
                </div>
            </div>

            <!-- Recent Students -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Recently Registered Students</span>
                    <a href="/page/students" class="btn btn-sm btn-outline">View All</a>
                </div>
                <div class="card-body" style="padding:0">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Student ID</th><th>Name</th><th>Email</th>
                                    <th>Department</th><th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recent-students-tbody">
                                <tr><td colspan="5" class="empty-state">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    if (!requireRole(['ADMIN'])) { /* redirected */ }

    renderUserInfo();
    applyRoleVisibility();
    document.getElementById('nav-home').classList.add('active');
    document.getElementById('current-date').textContent =
        new Date().toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    (async function init() {
        try {
            const [s, f, c] = await Promise.all([
                apiGet('/students'),
                apiGet('/faculty'),
                apiGet('/courses')
            ]);
            const students = s.data || [];
            const faculty  = f.data || [];
            const courses  = c.data || [];

            document.getElementById('stat-students').textContent = students.length;
            document.getElementById('stat-faculty') .textContent = faculty.length;
            document.getElementById('stat-courses') .textContent = courses.length;

            // Load total fee records count
            let feeCount = 0;
            const feeResults = await Promise.allSettled(
                students.slice(0, 20).map(st => apiGet('/fees/student/' + encodeURIComponent(st.studentId)))
            );
            feeResults.forEach(r => { if (r.status === 'fulfilled') feeCount += (r.value.data || []).length; });
            document.getElementById('stat-fees').textContent = feeCount;

            // Show last 5 students in recent table
            const recent = students.slice(-5).reverse();
            const tbody  = document.getElementById('recent-students-tbody');
            if (!recent.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No students yet.</td></tr>';
            } else {
                tbody.innerHTML = recent.map(st => `
                    <tr>
                        <td>${escHtml(st.studentId)}</td>
                        <td>${escHtml(st.firstName)} ${escHtml(st.lastName)}</td>
                        <td>${escHtml(st.email)}</td>
                        <td>${escHtml(st.departmentName || st.departmentCode || '—')}</td>
                        <td>${statusBadge(st.status)}</td>
                    </tr>`).join('');
            }
        } catch (err) {
            console.warn('Dashboard load failed:', err.message);
        }
    })();
</script>
</body>
</html>
