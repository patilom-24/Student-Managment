<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">

    <div th:replace="~{layout-nav :: sidebar}"></div>

    <div class="main-content">
        <header class="page-header">
            <h1 class="page-title">Dashboard</h1>
            <div class="header-right">
                <span style="font-size:.8rem;color:var(--text-muted)" id="current-date"></span>
            </div>
        </header>

        <main class="page-body">

            <!-- Stat cards -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">👥</div>
                    <div>
                        <div class="stat-label">Total Students</div>
                        <div class="stat-value" id="stat-students">—</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">👨‍🏫</div>
                    <div>
                        <div class="stat-label">Total Faculty</div>
                        <div class="stat-value" id="stat-faculty">—</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon yellow">📚</div>
                    <div>
                        <div class="stat-label">Total Courses</div>
                        <div class="stat-value" id="stat-courses">—</div>
                    </div>
                </div>
            </div>

            <!-- Quick links -->
            <div class="card" style="margin-bottom:1.5rem">
                <div class="card-header"><span class="card-title">Quick Access</span></div>
                <div class="card-body">
                    <div class="quick-links">
                        <a href="/page/students"   class="quick-card"><div class="qc-icon">👥</div><div class="qc-label">Students</div></a>
                        <a href="/page/faculty"    class="quick-card"><div class="qc-icon">👨‍🏫</div><div class="qc-label">Faculty</div></a>
                        <a href="/page/courses"    class="quick-card"><div class="qc-icon">📚</div><div class="qc-label">Courses</div></a>
                        <a href="/page/attendance" class="quick-card"><div class="qc-icon">📋</div><div class="qc-label">Attendance</div></a>
                        <a href="/page/fees"       class="quick-card"><div class="qc-icon">💰</div><div class="qc-label">Fees</div></a>
                    </div>
                </div>
            </div>

            <!-- API info -->
            <div class="card">
                <div class="card-header"><span class="card-title">API Information</span></div>
                <div class="card-body">
                    <p style="color:var(--text-muted);font-size:.875rem;margin-bottom:.75rem">
                        REST API base: <code style="background:var(--primary-light);padding:2px 6px;border-radius:4px">http://localhost:8080/api/v1</code>
                        &nbsp;|&nbsp; All protected routes require
                        <code style="background:var(--primary-light);padding:2px 6px;border-radius:4px">Authorization: Bearer &lt;token&gt;</code>
                    </p>
                    <a href="/page/docs" class="btn btn-outline btn-sm">View API Docs</a>
                </div>
            </div>

        </main>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    requireAuth();
    renderUserInfo();
    document.getElementById('nav-home').classList.add('active');
    document.getElementById('current-date').textContent =
        new Date().toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    // Load dashboard stats — GET /students, GET /faculty, GET /courses
    (async function loadStats() {
        try {
            const [s, f, c] = await Promise.all([
                apiGet('/students'),
                apiGet('/faculty'),
                apiGet('/courses')
            ]);
            document.getElementById('stat-students').textContent = (s.data || []).length;
            document.getElementById('stat-faculty') .textContent = (f.data || []).length;
            document.getElementById('stat-courses') .textContent = (c.data || []).length;
        } catch (err) {
            console.warn('Dashboard stats failed:', err.message);
        }
    })();
</script>
</body>
</html>
