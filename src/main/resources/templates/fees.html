<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees — Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout-nav :: sidebar}"></div>
    <div class="main-content">
        <header class="page-header">
            <h1 class="page-title">Fee Management</h1>
        </header>
        <main class="page-body">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem">

                <!-- Create Fee Record — POST /fees -->
                <div class="card">
                    <div class="card-header"><span class="card-title">Create Fee Record</span></div>
                    <div class="card-body">
                        <form id="fee-form" onsubmit="return false;">
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="fee-studentId">Student ID *</label>
                                <input id="fee-studentId" type="text" placeholder="e.g. STU2024001">
                                <span class="field-error" id="fee-studentId-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="fee-type">Fee Type *</label>
                                <select id="fee-type">
                                    <option value="">— Select Type —</option>
                                    <option value="TUITION">Tuition Fee</option>
                                    <option value="EXAM">Exam Fee</option>
                                    <option value="LIBRARY">Library Fee</option>
                                    <option value="HOSTEL">Hostel Fee</option>
                                    <option value="TRANSPORT">Transport Fee</option>
                                    <option value="OTHER">Other</option>
                                </select>
                                <span class="field-error" id="fee-type-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="fee-amount">Amount (₹) *</label>
                                <input id="fee-amount" type="number" min="0.01" step="0.01" placeholder="e.g. 25000">
                                <span class="field-error" id="fee-amount-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="fee-dueDate">Due Date</label>
                                <input id="fee-dueDate" type="date">
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="fee-academicYear">Academic Year</label>
                                <input id="fee-academicYear" type="text" placeholder="e.g. 2024-25">
                            </div>
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="fee-semester">Semester</label>
                                <input id="fee-semester" type="text" placeholder="e.g. SEM1">
                            </div>
                            <button class="btn btn-primary" style="width:100%" onclick="createFeeRecord()">Create Fee Record</button>
                        </form>
                    </div>
                </div>

                <!-- Record Payment — POST /fees/pay -->
                <div class="card">
                    <div class="card-header"><span class="card-title">Record Payment</span></div>
                    <div class="card-body">
                        <form id="pay-form" onsubmit="return false;">
                            <div class="form-group" style="margin-bottom:.75rem">
                                <label for="pay-feeId">Fee Record ID *</label>
                                <input id="pay-feeId" type="number" min="1" placeholder="Fee ID from the table below">
                                <span class="field-error" id="pay-feeId-error"></span>
                            </div>
                            <div class="form-group" style="margin-bottom:1.25rem">
                                <label for="pay-amount">Payment Amount (₹) *</label>
                                <input id="pay-amount" type="number" min="0.01" step="0.01" placeholder="Amount being paid">
                                <span class="field-error" id="pay-amount-error"></span>
                            </div>
                            <button class="btn btn-success" style="width:100%;margin-bottom:1.5rem" onclick="payFee()">Record Payment</button>
                        </form>

                        <hr style="border-color:var(--border);margin-bottom:1.25rem">

                        <p class="section-title">View Fees by Student</p>
                        <div class="search-box">
                            <input id="fee-filter-studentId" type="text" placeholder="Enter Student ID"
                                   onkeydown="if(event.key==='Enter') loadFeesByStudent()">
                            <button class="btn btn-primary"  onclick="loadFeesByStudent()">All Fees</button>
                            <button class="btn btn-warning"  onclick="loadPendingFees()">Pending</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Summary -->
            <div id="fee-summary" style="display:none;margin-bottom:1rem"></div>

            <!-- Fee Table -->
            <div class="card">
                <div class="card-header"><span class="card-title">Fee Records</span></div>
                <div class="card-body" style="padding:0">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Fee ID</th><th>Type</th><th>Total Amount</th>
                                    <th>Paid</th><th>Outstanding</th><th>Status</th>
                                    <th>Due Date</th><th>Paid Date</th><th>Semester</th>
                                </tr>
                            </thead>
                            <tbody id="fee-tbody">
                                <tr><td colspan="9" class="empty-state">Enter a Student ID above to view fees.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/validation.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/fees.js}"></script>
<script>
    requireAuth();
    renderUserInfo();
    document.getElementById('nav-fees').classList.add('active');
</script>
</body>
</html>
