<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-logo">
        <div class="icon">🎓</div>
        <h1>Student Management</h1>
        <p>Sign in to your account</p>
    </div>

    <form class="login-form" id="login-form" onsubmit="return false;">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter username" autocomplete="username">
            <span class="field-error" id="username-error"></span>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
            <span class="field-error" id="password-error"></span>
        </div>
        <button class="btn btn-primary btn-lg login-btn" onclick="handleLogin()">Sign In</button>
    </form>

    <div class="demo-hint">
        <strong>Demo Credentials</strong>
        <p>👤 admin &nbsp;/&nbsp; admin123</p>
        <p>👤 faculty &nbsp;/&nbsp; faculty123</p>
        <p>👤 student &nbsp;/&nbsp; student123</p>
    </div>
</div>

<!-- api.js first (defines TOKEN_KEY), then auth.js, then common.js -->
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    redirectIfLoggedIn();

    document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        // Clear previous errors
        document.querySelectorAll('.field-error').forEach(el => el.style.display = 'none');
        document.querySelectorAll('input').forEach(el => el.classList.remove('is-invalid'));

        let hasError = false;
        if (!username) {
            document.getElementById('username-error').textContent = 'Username is required.';
            document.getElementById('username-error').style.display = 'block';
            document.getElementById('username').classList.add('is-invalid');
            hasError = true;
        }
        if (!password) {
            document.getElementById('password-error').textContent = 'Password is required.';
            document.getElementById('password-error').style.display = 'block';
            document.getElementById('password').classList.add('is-invalid');
            hasError = true;
        }
        if (hasError) return;

        const btn = document.querySelector('.login-btn');
        btn.disabled    = true;
        btn.textContent = 'Signing in…';

        try {
            await doLogin(username, password);
            showToast('Login successful! Redirecting…', 'success');
            setTimeout(() => window.location.href = '/page/home', 800);
        } catch (err) {
            showToast(err.message || 'Login failed. Check your credentials.', 'error');
            document.getElementById('password').value = '';
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Sign In';
        }
    }
</script>
</body>
</html>
